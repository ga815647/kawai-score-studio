<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="scorebook-version" content="{{SCOREBOOK_VERSION}}">
  <meta name="scorebook-sha256" content="{{SCOREBOOK_SHA256}}">
  <title>Kawai Score Studio</title>
  <link rel="stylesheet" href="./design.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="toolbar">
    <div>
      <p class="eyebrow">Kawai Score Studio</p>
      <h1>木琴正式曲庫</h1>
    </div>
  </header>

  <main>
    <section id="status" class="status" aria-live="polite">載入規格中…</section>

    <section id="library-view">
      <header class="view-heading">
        <div>
          <p class="section-kicker">Verified Library</p>
          <h2>正式曲庫</h2>
        </div>
        <p>每首曲目都可直接播放、停止或單獨以 A4 直式列印。</p>
      </header>
      <div id="library-content"></div>
      <details id="quarantine-panel" class="quarantine-panel" hidden>
        <summary>查看隔離中的舊曲目</summary>
        <ul id="quarantine-list"></ul>
      </details>
    </section>

    <section id="studio-view" hidden aria-label="內部合成測試">
      <div id="fixture-view">
        <article id="score-page" class="score-page fixture-score-page">
          <header class="score-header">
            <p id="score-badge" class="score-badge">SYNTHETIC FIXTURE</p>
            <h2 id="score-title">尚未載入測試資料</h2>
            <p id="score-meta"></p>
          </header>
          <div id="score-render" class="score-render"></div>
        </article>
      </div>
    </section>
  </main>

  <template id="error-template">
    <section class="error-card">
      <h2>無法載入</h2>
      <pre></pre>
    </section>
  </template>

  <script src="./vendor/vexflow.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
