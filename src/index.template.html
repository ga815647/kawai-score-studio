<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="scorebook-version" content="{{SCOREBOOK_VERSION}}">
  <meta name="scorebook-sha256" content="{{SCOREBOOK_SHA256}}">
  <title>Kawai Score Studio</title>
  <link rel="stylesheet" href="./design.css?v={{ASSET_VERSION}}">
  <link rel="stylesheet" href="./styles.css?v={{ASSET_VERSION}}">
  <style>
    @media print {
      .print-selected .score-render { display: block; }
      .print-selected .score-system {
        padding-top: var(--maximum-event-vertical-shift);
        margin-top: calc(-1 * var(--maximum-event-vertical-shift));
        margin-bottom: 24px;
      }
      .print-selected .score-system:last-child { margin-bottom: 0; }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <div>
      <p class="eyebrow">Kawai Score Studio</p>
      <h1>木琴正式曲庫</h1>
    </div>
  </header>

  <main>
    <section id="status" class="status" aria-live="polite">載入規格中…</section>

    <nav id="song-directory" class="song-directory" aria-labelledby="song-directory-title">
      <header class="directory-heading">
        <div>
          <p class="section-kicker">Contents</p>
          <h2 id="song-directory-title">曲目目錄</h2>
        </div>
        <p>點選曲名可直接跳到該首琴譜。</p>
      </header>
      <ol id="song-directory-list" class="song-directory-list"></ol>
    </nav>

    <section id="library-view">
      <header class="view-heading">
        <div>
          <p class="section-kicker">Verified Library</p>
          <h2>正式曲庫</h2>
        </div>
        <p>每首曲目都可直接播放、停止或單獨以 A4 直式列印。</p>
      </header>
      <div id="library-content"></div>
    </section>

    <section id="studio-view" hidden aria-label="內部合成測試">
      <div id="fixture-view">
        <article id="score-page" class="score-page fixture-score-page">
          <header class="score-header">
            <p id="score-badge" class="score-badge">SYNTHETIC FIXTURE</p>
            <h2 id="score-title">尚未載入測試資料</h2>
            <p id="score-meta"></p>
          </header>
          <div id="score-render" class="score-render"></div>
        </article>
      </div>
    </section>
  </main>

  <template id="error-template">
    <section class="error-card">
      <h2>無法載入</h2>
      <pre></pre>
    </section>
  </template>

  <script src="./vendor/vexflow.js?v={{ASSET_VERSION}}"></script>
  <script type="module" src="./app.js?v={{ASSET_VERSION}}"></script>
</body>
</html>
