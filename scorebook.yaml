          - { pitch: "5", duration: 1, lyric: 你 }
          - { pitch: "5^", duration: 2, lyric: 生 }
          - { pitch: "3^", duration: 2, lyric: 日 }
          - { pitch: "1^", duration: 2, lyric: 快 }
          - { pitch: "7", duration: 2, lyric: 樂 }
          - { pitch: "6", duration: 4, lyric: 呀 }
      - events:
