- generate_html
- run_html_gate
- run_browser_visual_gate
- capture_visual_gate_screenshots
- run_print_gate
- publish_only_after_required_gates_pass
gates:
  content:
    required: true
    checks:
    - single_chat_project_handles_content_and_development
    - assistant_classifies_request_without_user_mode_selection
    - public_library_contains_only_verified_songs
    - exact_source_metadata_present
    - source_route_is_user_provided_or_assistant_web_research
    - primary_source_is_inspectable_static_notation
    - source_locator_is_url_or_hashed_file_reference
    - youtube_video_audio_and_memory_are_not_transcription_sources
    - workflow_stops_without_verifiable_static_source
    - source_to_scorebook_checked
    - complete_music_verification_present
    - original_language_track_is_default
    - selected_traditional_localized_variant_is_exactly_sourced
    - melody_events_do_not_embed_lyrics
    - explicit_measures_rests_pickup_and_ties
    - instrument_range
    - public_website_is_library_only
    - synthetic_fixture_has_no_public_navigation
    - public_song_directory_precedes_verified_library
    - public_quarantine_panel_is_absent
    - public_studio_controls_are_absent
  fixture:
    required: true
    checks:
    - fixtures_are_synthetic
    - note_and_rest_events_supported
    - measure_duration_is_valid
    - pickup_measure_is_valid
    - tie_references_are_valid
    - lyric_event_references_are_valid
    - long_english_syllables_participate_in_spacing
    - fixture_renders_at_least_two_systems
    - fixture_contains_instrument_lowest_note
    - fixture_contains_instrument_highest_note
  source:
    required: true
    checks:
    - source_fixture_is_synthetic
    - source_is_musicxml_4_score_partwise
    - entity_declarations_are_rejected
    - official_schema_files_match_pinned_git_blob_shas
    - source_musicxml_passes_xsd
    - source_is_single_part_and_monophonic
    - music21_normalized_events_match_scorebook_exactly
    - music21_roundtrip_passes_xsd
    - music21_roundtrip_events_match_source_exactly
    - verovio_svg_is_created
    - verovio_midi_is_created
    - source_reports_are_complete
  html:
    required: true
    checks:
    - numbered_notation_above_staff
    - lyrics_below_staff
    - lyrics_rendered_in_shared_html_row
    - vexflow_annotations_not_used_for_lyrics
    - song_standard_rows_used_by_default
    - standard_label_positions_are_derived_from_scorebook_geometry
    - locked_numbered_and_lyric_rows_are_preserved_when_staff_moves
    - per_event_adjustment_uses_vexflow_stavenote_pointer_rect
    - numbered_notation_and_lyrics_use_separate_clearance_thresholds
    - extreme_notes_use_the_same_collision_rule_as_all_other_notes
    - one_event_source_for_numbered_notation_staff_and_playback
    - lyric_track_is_separate_from_events
    - verified_song_uses_formal_width_budget
    - tie_connected_measures_are_not_split
    - lyric_spacing_uses_minimal_recentered_tick_shift
    - lyric_spacing_moves_notes_and_bar_boundaries_together
    - no_generated_text_from_images
    - public_navigation_contains_only_library
    - synthetic_fixture_is_available_only_by_internal_query_route
    - every_verified_song_has_play_stop_and_print_controls
    - print_target_is_selected_verified_song
    - song_directory_links_target_every_verified_song
    - public_html_has_no_quarantine_panel
    - studio_markup_is_hidden_internal_fixture_only
    - every_verified_song_has_explicit_a4_print_control
    - static_assets_are_versioned_by_scorebook_hash
    - stale_index_reloads_to_current_build_hash
  visual:
    required: true
    measurements:
      minimum_system_count: 2
      numbered_to_staff_top_line_gap_px:
        min: 8
        max: 12
      staff_bottom_line_to_lyric_top_px:
        min: 16
        max: 20
      lyric_vertical_alignment_delta_px:
        max: 1
      adjusted_numbered_glyph_clearance_px:
        min: 0
      adjusted_lyric_glyph_clearance_px:
        min: 2
      horizontal_lyric_gap_px:
        min: 8
      default_row_delta_across_systems_px:
        max: 1
      maximum_individual_shift_px:
        max: 32
      maximum_horizontal_shift_px:
        max: 24
    checks:
    - chromium_screenshot_created
    - at_least_two_systems_are_screenshot_tested
    - numbered_notation_staff_and_lyrics_do_not_overlap
    - numbered_notation_to_staff_gap_within_spec
    - lyrics_are_below_staff
    - default_rows_match_across_entire_score
    - staff_moves_up_without_moving_default_numbered_row
    - staff_moves_up_without_moving_default_lyric_row
    - uncollided_events_keep_zero_vertical_shift
    - numbered_notation_moves_only_for_actual_overlap
    - lyrics_keep_two_pixel_clearance
    - colliding_numbered_notation_moves_up_only
    - colliding_lyric_moves_down_only
    - extreme_events_follow_the_same_minimal_shift_rule
    - extreme_event_may_remain_unshifted_when_clearance_is_sufficient
    - instrument_highest_note_is_exercised
    - instrument_lowest_note_is_exercised
    - adjusted_elements_keep_label_specific_glyph_clearance
    - lyric_centers_match_notehead_centers
    - long_english_syllables_do_not_collide
    - verified_song_lyrics_do_not_overlap
    - verified_song_cross_measure_ties_are_visible
    - verified_song_horizontal_shifts_stay_within_limit
    - all_verified_library_songs_render
    - no_horizontal_scroll
    - song_directory_click_scrolls_to_target_song
    - a4_print_control_is_visible_for_every_verified_song
  print:
    required: true
    checks:
    - a4_portrait
    - song_page_not_split
    - no_horizontal_overflow
    - numbered_notation_staff_and_lyrics_remain_readable
    - locked_numbered_and_lyric_rows_survive_print
    - song_standard_rows_survive_print
    - per_event_extreme_note_adjustments_survive_print
    - selected_verified_song_only
    - synthetic_fixture_is_never_printed_from_library
    - a4_margin_matches_spec
    - page_breaks_only_between_complete_systems
    - complete_system_is_not_split
    - multi_page_output_remains_readable
  release:
    required: true
    pass_when:
    - all_required_gates_pass
