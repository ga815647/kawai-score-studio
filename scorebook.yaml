          - { pitch: "2", duration: 1, lyric: 出 }
          - { pitch: "3", duration: 3, lyric: 來 }
          - { pitch: "3", duration: 3, lyric: 曬 }
          - { pitch: "2", duration: 2, lyric: 乾 }
