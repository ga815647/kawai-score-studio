          - { pitch: "5", duration: 1, lyric: 你 }
          - { pitch: "6", duration: 2, lyric: 生 }
          - { pitch: "5", duration: 2, lyric: 日 }
          - { pitch: "1^", duration: 2, lyric: 快 }
          - { pitch: "7", duration: 4, lyric: 樂, bar_after: true }
          - { pitch: "5", duration: 1, lyric: 祝 }
          - { pitch: "5", duration: 1, lyric: 你 }
          - { pitch: "6", duration: 2, lyric: 生 }
          - { pitch: "5", duration: 2, lyric: 日 }
          - { pitch: "2^", duration: 2, lyric: 快 }
          - { pitch: "1^", duration: 4, lyric: 樂 }
      - events:
