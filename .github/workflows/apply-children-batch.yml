name: Apply children batch

on:
  push:
    branches:
      - codex/children-batch-ode-mice-buns-mulberry-20260808

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply canonical scorebook and test changes
        run: |
          set +e
          output=$(python scripts/apply_children_batch.py 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            last_line=$(printf '%s\n' "$output" | tail -n 1)
            echo "::error title=Batch applicator failed::$last_line"
            exit "$status"
          fi
      - name: Commit final batch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: add Ode to Joy, Three Blind Mice, Hot Cross Buns, Mulberry Bush"
          git push origin HEAD:codex/children-batch-ode-mice-buns-mulberry-20260808
