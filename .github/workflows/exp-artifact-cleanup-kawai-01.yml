name: EXP Artifact Cleanup Kawai 01 Summary

on:
  push:
    branches:
      - exp/artifact-cleanup-kawai-01-20260820
    paths:
      - experiments/EXP_ARTIFACT_CLEANUP_KAWAI_01_TRIGGER.txt

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EVIDENCE_PATH: experiments/EXP_ARTIFACT_CLEANUP_KAWAI_01_20260820.json
      SUMMARY_PATH: experiments/EXP_ARTIFACT_CLEANUP_KAWAI_01_SUMMARY.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build compact durable summary from cleanup evidence
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence_path = Path(os.environ['EVIDENCE_PATH'])
          summary_path = Path(os.environ['SUMMARY_PATH'])
          e = json.loads(evidence_path.read_text(encoding='utf-8'))

          def compact_artifact(a):
              wr = a.get('workflow_run') or {}
              return {
                  'id': a.get('id'),
                  'name': a.get('name'),
                  'size_bytes': a.get('size_bytes'),
                  'classification': a.get('classification'),
                  'created_at': a.get('created_at'),
                  'expires_at': a.get('expires_at'),
                  'run_id': wr.get('id'),
                  'run_name': wr.get('name'),
                  'event': wr.get('event'),
                  'conclusion': wr.get('conclusion'),
                  'head_branch': wr.get('head_branch'),
                  'head_sha': wr.get('head_sha'),
              }

          before = e.get('before') or {}
          deleted = e.get('deleted') or {}
          kept = e.get('kept') or {}
          after = e.get('after') or {}
          deleted_artifacts = sorted(deleted.get('artifacts') or [], key=lambda x: (-(x.get('size_bytes') or 0), x.get('id') or 0))
          remaining_artifacts = sorted(after.get('artifacts') or [], key=lambda x: (-(x.get('size_bytes') or 0), x.get('id') or 0))

          class_bytes = {}
          class_count = {}
          for a in remaining_artifacts:
              c = a.get('classification') or 'UNKNOWN'
              class_bytes[c] = class_bytes.get(c, 0) + int(a.get('size_bytes') or 0)
              class_count[c] = class_count.get(c, 0) + 1

          summary = {
              'package': e.get('package'),
              'repo': e.get('repo'),
              'state': e.get('state'),
              'main_sha': e.get('main_sha'),
              'generated_at_utc': e.get('generated_at_utc'),
              'execution_run_id': e.get('execution_run_id'),
              'before_count': before.get('count'),
              'before_bytes': before.get('bytes'),
              'deleted_count': deleted.get('count'),
              'deleted_bytes': deleted.get('bytes'),
              'kept_acceptance_bytes': kept.get('acceptance_bytes'),
              'kept_active_deployment_bytes': kept.get('active_deployment_bytes'),
              'unknown_bytes': kept.get('unknown_bytes'),
              'after_count': after.get('count'),
              'after_bytes': after.get('bytes'),
              'remaining_class_count': class_count,
              'remaining_class_bytes': class_bytes,
              'top_deleted': [compact_artifact(a) for a in deleted_artifacts[:10]],
              'top_remaining': [compact_artifact(a) for a in remaining_artifacts[:10]],
              'all_deleted': [compact_artifact(a) for a in deleted_artifacts],
              'duplication_finding': e.get('duplication_finding'),
              'blockers': e.get('blockers') or [],
          }
          summary_path.write_text(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(summary, separators=(',', ':'), ensure_ascii=False))
          PY
      - name: Persist compact summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SUMMARY_PATH"
          if git diff --cached --quiet; then
            echo "No summary change."
          else
            git commit -m "chore: persist artifact cleanup compact summary"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
