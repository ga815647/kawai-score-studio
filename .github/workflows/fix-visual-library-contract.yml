name: Fix visual library contract

on:
  push:
    branches:
      - feat/children-batch-humpty-donkey-friends
    paths:
      - .github/workflows/fix-visual-library-contract.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/children-batch-humpty-donkey-friends
          fetch-depth: 0
      - name: Update visual contract
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('tests/library-visual.spec.mjs')
          s = p.read_text(encoding='utf-8')
          marker = "  { id: 'tantan-houhou', title: '淡々泡々', notes: 124, lyrics: 0 },\n];"
          replacement = "  { id: 'tantan-houhou', title: '淡々泡々', notes: 124, lyrics: 0 },\n  { id: 'humpty-dumpty', title: 'Humpty Dumpty', notes: 36, lyrics: 36 },\n  { id: 'little-donkey-zh', title: '小毛驢', notes: 55, lyrics: 55 },\n  { id: 'find-a-friend-zh', title: '找朋友', notes: 28, lyrics: 28 },\n  { id: 'london-bridge-zh', title: '倫敦鐵橋垮下來', notes: 25, lyrics: 25 },\n  { id: 'if-you-are-happy-clap-zh', title: '如果感到幸福你就拍拍手', notes: 46, lyrics: 46 },\n];"
          if marker not in s:
              raise SystemExit('songs marker not found')
          s = s.replace(marker, replacement, 1)
          s = s.replace("toContainText('規格 0.6.21')", "toContainText('規格 0.6.22')", 1)
          s = s.replace("toHaveCount(16);", "toHaveCount(21);", 2)
          s = s.replace("url.includes('?v=0.6.21-')", "url.includes('?v=0.6.22-')", 2)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-visual-library-contract.yml
          git add tests/library-visual.spec.mjs
          git commit -m "test: update visual contract for 21-song library"
          git push origin HEAD:feat/children-batch-humpty-donkey-friends
