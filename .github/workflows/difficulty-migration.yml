name: Difficulty migration

on:
  push:
    branches:
      - feat/song-difficulty-sort

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/song-difficulty-sort
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch canonical scorebook first
        run: python scripts/apply_difficulty_patch.py
      - name: Commit migration results
        run: |
          if git diff --quiet; then
            echo 'No migration changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scorebook.yaml src/app.js package.json scripts/lib.mjs
          git commit -m 'feat: enforce song difficulty contract'
          git push origin HEAD:feat/song-difficulty-sort
