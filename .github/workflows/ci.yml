name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Install pinned Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Run schema, fixture, build, unit, and browser gates
        run: npm run check:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-reports-${{ github.sha }}
          path: |
            reports/
            test-results/
          if-no-files-found: warn
          retention-days: 14
