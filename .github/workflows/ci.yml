name: CI

on:
  push:
  pull_request:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/exp/artifact-cleanup-kawai')) || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'exp/artifact-cleanup-kawai')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Scoped repo-wide artifact cleanup without artifact upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_BRANCH: exp/artifact-cleanup-kawai-01
          AUTHORITATIVE_MAIN_SHA: d3be667912b650e694b7faf89197b0d9fca50133
          BEFORE_PATH: infra/EXP_ARTIFACT_CLEANUP_KAWAI_01_before_delete.json
          EVIDENCE_PATH: infra/EXP_ARTIFACT_CLEANUP_KAWAI_01_cleanup.json
        run: |
          python - <<'PY'
          import base64, datetime as dt, json, os, urllib.error, urllib.parse, urllib.request

          api = os.environ['GH_API_URL'].rstrip('/')
          repo = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          branch = os.environ['GH_BRANCH']
          main_sha = os.environ['AUTHORITATIVE_MAIN_SHA']
          before_path = os.environ['BEFORE_PATH']
          evidence_path = os.environ['EVIDENCE_PATH']
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}

          def request(path, method='GET', body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(api + path, headers=headers, data=data, method=method)
              with urllib.request.urlopen(req) as r:
                  raw = r.read()
                  return json.loads(raw) if raw else None

          def persist(path, obj, message):
              text = json.dumps(obj, indent=2, sort_keys=True) + '\n'
              payload = {'message': message, 'content': base64.b64encode(text.encode()).decode(), 'branch': branch}
              encoded_path = '/'.join(urllib.parse.quote(part, safe='') for part in path.split('/'))
              endpoint = f'/repos/{repo}/contents/{encoded_path}'
              try:
                  existing = request(endpoint + '?ref=' + urllib.parse.quote(branch, safe=''))
                  payload['sha'] = existing['sha']
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise
              request(endpoint, method='PUT', body=payload)

          def ts(v):
              return dt.datetime.fromisoformat(v.replace('Z', '+00:00')) if v else None

          def enumerate_rows():
              artifacts, page = [], 1
              while True:
                  payload = request(f'/repos/{repo}/actions/artifacts?per_page=100&page={page}')
                  batch = payload.get('artifacts', [])
                  artifacts.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              cache, rows = {}, []
              for a in artifacts:
                  wr = a.get('workflow_run') or {}
                  rid = wr.get('id')
                  run, run_error = None, None
                  if rid:
                      if rid not in cache:
                          try:
                              cache[rid] = request(f'/repos/{repo}/actions/runs/{rid}')
                          except Exception as exc:
                              cache[rid] = {'_error': repr(exc)}
                      got = cache[rid]
                      if '_error' in got:
                          run_error = got['_error']
                      else:
                          run = {k: got.get(k) for k in ['id','name','event','status','conclusion','workflow_id','run_number','run_attempt','head_branch','head_sha','created_at','updated_at','html_url']}
                  rows.append({'id': a.get('id'), 'name': a.get('name'), 'size_bytes': int(a.get('size_in_bytes') or 0), 'created_at': a.get('created_at'), 'expires_at': a.get('expires_at'), 'expired': a.get('expired'), 'workflow_run_ref': wr, 'run': run, 'run_error': run_error})
              return rows

          before = enumerate_rows()
          before_count = len(before)
          before_bytes = sum(r['size_bytes'] for r in before)
          current_ci = [r for r in before if r.get('run') and r['run'].get('name') == 'CI' and r['run'].get('event') == 'push' and r['run'].get('head_branch') == 'main' and r['run'].get('head_sha') == main_sha and r['run'].get('conclusion') == 'success']
          current_pages = [r for r in before if r.get('run') and r['run'].get('name') == 'Deploy Pages' and r['run'].get('head_branch') == 'main' and r['run'].get('head_sha') == main_sha and r['run'].get('conclusion') == 'success']
          ci_time = max((ts(r['run'].get('created_at')) for r in current_ci), default=None)
          pages_time = max((ts(r['run'].get('created_at')) for r in current_pages), default=None)
          push_heads = {r['run']['head_sha'] for r in before if (r.get('name') or '').startswith('gate-reports-') and r.get('run') and r['run'].get('name') == 'CI' and r['run'].get('event') == 'push' and r['run'].get('conclusion') == 'success' and r['run'].get('head_sha')}

          decisions = []
          for r in before:
              name, run = r.get('name') or '', r.get('run')
              c, action, reason = 'UNKNOWN', 'KEEP', 'unrecognized artifact type or unresolved run identity'
              gate, pregate, pages = name.startswith('gate-reports-'), name.startswith('pages-gate-reports-'), name == 'github-pages'
              if run and gate and run.get('name') == 'CI' and run.get('event') == 'push' and run.get('head_branch') == 'main' and run.get('head_sha') == main_sha and run.get('conclusion') == 'success':
                  c, reason = 'UNIQUE_CURRENT_ACCEPTANCE_EVIDENCE', 'successful current-main exact-SHA CI gate evidence'
              elif run and pregate and run.get('name') == 'Deploy Pages' and run.get('head_branch') == 'main' and run.get('head_sha') == main_sha and run.get('conclusion') == 'success':
                  c, reason = 'UNIQUE_CURRENT_ACCEPTANCE_EVIDENCE', 'successful current-main Pages re-Gate evidence'
              elif run and pages and run.get('name') == 'Deploy Pages' and run.get('head_branch') == 'main' and run.get('head_sha') == main_sha and run.get('conclusion') == 'success':
                  c, reason = 'ACTIVE_DEPLOYMENT_DEPENDENCY', 'current-main successful Pages deployment artifact'
              elif not run or r.get('run_error'):
                  c, reason = 'UNKNOWN', 'run identity unresolved; fail closed'
              elif gate:
                  rt = ts(run.get('created_at'))
                  if ci_time and rt and rt < ci_time:
                      if run.get('event') == 'pull_request' and run.get('head_sha') in push_heads:
                          c, reason = 'DUPLICATE_TRANSPORT', 'same head has successful push CI; later current-main exact-SHA CI is authoritative'
                      elif run.get('conclusion') in {'failure','cancelled','timed_out','action_required','startup_failure','stale'}:
                          c, reason = 'DISPOSABLE_DEBUG_TEST', 'failed CI intermediate superseded by later current-main exact-SHA success'
                      else:
                          c, reason = 'SUPERSEDED_INTERMEDIATE', 'non-current CI evidence predates later authoritative current-main exact-SHA success'
                      action = 'DELETE'
                  else:
                      reason = 'not proven older than current-main CI anchor'
              elif pregate or pages:
                  rt = ts(run.get('created_at'))
                  if pages_time and rt and rt < pages_time:
                      if run.get('conclusion') in {'failure','cancelled','timed_out','action_required','startup_failure','stale'}:
                          c, reason = 'DISPOSABLE_DEBUG_TEST', 'failed Pages intermediate superseded by later current-main deployment'
                      else:
                          c, reason = 'SUPERSEDED_INTERMEDIATE', 'older Pages/re-Gate artifact superseded by later current-main deployment'
                      action = 'DELETE'
                  else:
                      reason = 'not proven older than current-main Pages anchor'
              decisions.append({'id': r['id'], 'name': r['name'], 'size_bytes': r['size_bytes'], 'classification': c, 'action': action, 'reason': reason, 'created_at': r['created_at'], 'expires_at': r['expires_at'], 'expired': r['expired'], 'run': run})

          persist(before_path, {'package':'EXP-ARTIFACT-CLEANUP-KAWAI-01','phase':'official_before_delete','repo':repo,'authoritative_main_sha':main_sha,'count':before_count,'bytes':before_bytes,'artifacts':before,'decisions':decisions}, 'infra(exp): persist official pre-delete artifact inventory')

          candidates = [d for d in decisions if d['action'] == 'DELETE']
          blockers = []
          if not current_ci:
              blockers.append('No successful current-main exact-SHA CI artifact anchor found.')
          if any(d['name'] == 'github-pages' or d['name'].startswith('pages-gate-reports-') for d in candidates) and not current_pages:
              blockers.append('No successful current-main Pages artifact anchor found.')

          preflight = []
          if not blockers:
              for d in candidates:
                  try:
                      live = request(f"/repos/{repo}/actions/artifacts/{d['id']}")
                      expected = [d['id'], d['name'], d['size_bytes']]
                      actual = [live.get('id'), live.get('name'), int(live.get('size_in_bytes') or 0)]
                      match = expected == actual
                      preflight.append({'id':d['id'],'expected':expected,'actual':actual,'match':match})
                      if not match:
                          blockers.append(f"Preflight mismatch for artifact {d['id']}: expected={expected} actual={actual}")
                  except Exception as exc:
                      blockers.append(f"Preflight read failed for artifact {d['id']}: {exc!r}")

          deleted, delete_errors = [], []
          if not blockers:
              for d in candidates:
                  try:
                      request(f"/repos/{repo}/actions/artifacts/{d['id']}", method='DELETE')
                      deleted.append(d)
                  except Exception as exc:
                      delete_errors.append({'id':d['id'],'name':d['name'],'size_bytes':d['size_bytes'],'error':repr(exc)})
                      break

          after = enumerate_rows()
          after_count, after_bytes = len(after), sum(r['size_bytes'] for r in after)
          deleted_bytes = sum(d['size_bytes'] for d in deleted)
          after_ids = {r['id'] for r in after}
          checks = {'all_deleted_absent': all(d['id'] not in after_ids for d in deleted), 'count_delta_ok': before_count-after_count == len(deleted), 'byte_delta_ok': before_bytes-after_bytes == deleted_bytes}
          if blockers:
              state = 'BLOCKED'
          elif delete_errors or not all(checks.values()):
              state = 'INCONCLUSIVE'
          else:
              state = 'PASS'

          byid = {d['id']:d for d in decisions}
          remaining = [{'id':r['id'],'name':r['name'],'size_bytes':r['size_bytes'],'classification':byid.get(r['id'],{}).get('classification','UNKNOWN'),'run':r.get('run')} for r in after]
          class_counts, class_bytes = {}, {}
          for d in decisions:
              c=d['classification']; class_counts[c]=class_counts.get(c,0)+1; class_bytes[c]=class_bytes.get(c,0)+d['size_bytes']
          result = {
              'state':state,'package':'EXP-ARTIFACT-CLEANUP-KAWAI-01','repo':repo,'authoritative_main_sha':main_sha,
              'before_count':before_count,'before_bytes':before_bytes,'before_mib':before_bytes/1048576,
              'deleted_count':len(deleted),'deleted_bytes':deleted_bytes,'deleted_mib':deleted_bytes/1048576,
              'kept_acceptance_bytes':sum(d['size_bytes'] for d in decisions if d['classification']=='UNIQUE_CURRENT_ACCEPTANCE_EVIDENCE'),
              'kept_active_deployment_bytes':sum(d['size_bytes'] for d in decisions if d['classification']=='ACTIVE_DEPLOYMENT_DEPENDENCY'),
              'unknown_bytes':sum(d['size_bytes'] for d in decisions if d['classification']=='UNKNOWN'),
              'after_count':after_count,'after_bytes':after_bytes,'after_mib':after_bytes/1048576,
              'top_deleted':sorted(deleted,key=lambda x:(-x['size_bytes'],x['id']))[:10],
              'top_remaining':sorted(remaining,key=lambda x:(-x['size_bytes'],x['id']))[:10],
              'duplication_finding':{
                  'push_pr_duplicate_artifacts_deleted':sum(1 for d in deleted if d['classification']=='DUPLICATE_TRANSPORT'),
                  'older_pages_or_pages_regate_artifacts_deleted':sum(1 for d in deleted if d['name']=='github-pages' or d['name'].startswith('pages-gate-reports-')),
                  'architecture':'CI uploads on push and pull_request; Pages reruns required gates after successful main CI and uploads Pages re-Gate plus github-pages deployment artifact.'},
              'preflight_count':len(preflight),'preflight_all_exact':all(p['match'] for p in preflight) if candidates else True,
              'blockers':blockers,'delete_errors':delete_errors,'delta_checks':checks,'classification_counts':class_counts,'classification_bytes':class_bytes,'deleted':deleted,'remaining':remaining}
          persist(evidence_path,result,'infra(exp): persist verified artifact cleanup result')
          print(json.dumps({k:result[k] for k in ['state','before_count','before_bytes','deleted_count','deleted_bytes','kept_acceptance_bytes','kept_active_deployment_bytes','unknown_bytes','after_count','after_bytes','delta_checks','classification_counts']},sort_keys=True))
          if state != 'PASS':
              raise SystemExit(1)
          PY

  check:
    if: ${{ !((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/exp/artifact-cleanup-kawai')) || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'exp/artifact-cleanup-kawai'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-source.txt
      - name: Install source verification tools
        run: python -m pip install -r requirements-source.txt
      - run: npm install
      - name: Install pinned Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Run schema, source, fixture, build, unit, and browser gates
        run: npm run check:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-reports-${{ github.sha }}
          path: |
            reports/
            test-results/
          if-no-files-found: warn
          retention-days: 14
