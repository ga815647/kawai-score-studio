name: CI

on:
  push:
  pull_request:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/exp/artifact-cleanup-kawai')) || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'exp/artifact-cleanup-kawai')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run bounded artifact cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
        run: python infra/artifact_cleanup_kawai.py

  check:
    if: ${{ !((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/exp/artifact-cleanup-kawai')) || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'exp/artifact-cleanup-kawai'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-source.txt
      - name: Install source verification tools
        run: python -m pip install -r requirements-source.txt
      - run: npm install
      - name: Install pinned Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Run schema, source, fixture, build, unit, and browser gates
        run: npm run check:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-reports-${{ github.sha }}
          path: |
            reports/
            test-results/
          if-no-files-found: warn
          retention-days: 14
