name: KSS Release Test Fix

on:
  push:
    branches:
      - feat/children-batch-head-ducks-painter

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update release regression expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/scorebook.test.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "test('0.6.22 has twenty-one verified songs, no quarantine, and passes structural gates'": "test('0.6.23 has twenty-six verified songs, no quarantine, and passes structural gates'",
              "assert.equal(book.project.version, '0.6.22');": "assert.equal(book.project.version, '0.6.23');",
              '    verifiedSongs: 21,': '    verifiedSongs: 26,',
              "    'if-you-are-happy-clap-zh',\n": "    'if-you-are-happy-clap-zh',\n    'head-shoulders-knees-and-toes',\n    'five-little-ducks',\n    'i-am-a-painter-zh',\n    'counting-ducks-zh',\n    'little-rabbit-be-good-zh',\n",
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, f'unexpected occurrence count for {old!r}: {text.count(old)}'
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/scorebook.test.mjs .github/workflows/ci.yml
          git commit -m "test: update release expectations for 0.6.23"
          git push origin HEAD:${GITHUB_REF_NAME}
