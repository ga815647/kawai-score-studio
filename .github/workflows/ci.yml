name: KSS Batch Apply

on:
  push:
    branches:
      - feat/children-batch-head-ducks-painter

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install YAML writer
        run: python -m pip install pyyaml==6.0.3
      - name: Apply verified song batch
        run: python .github/kss-batch/apply.py
      - name: Commit canonical scorebook update
        run: |
          rm -rf .github/kss-batch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add five children songs"
          git push origin HEAD:${GITHUB_REF_NAME}
