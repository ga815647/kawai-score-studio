name: Normalize Pages timeout patch

on:
  push:
    branches:
      - codex/pages-visual-timeout-50-songs-20260808

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pages-visual-timeout-50-songs-20260808
      - name: Keep only the full-library timeout adjustment
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/library-visual.spec.mjs')
          text = path.read_text(encoding='utf-8')
          marker = "test('selected-song print produces readable A4 output and never prints the fixture, directory, or other songs', async ({ page }) => {\n  // Full-library geometry validation scales with the verified-song count.\n  test.setTimeout(240_000);\n"
          replacement = "test('selected-song print produces readable A4 output and never prints the fixture, directory, or other songs', async ({ page }) => {\n  test.setTimeout(120_000);\n"
          if text.count(marker) != 1:
              raise SystemExit(f'expected selected-print timeout marker once, found {text.count(marker)}')
          path.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY
      - name: Commit normalized patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/normalize-pages-timeout-fix.yml
          git add tests/library-visual.spec.mjs
          git commit -m "ci: keep Pages timeout fix scoped to full library"
          git push origin HEAD:codex/pages-visual-timeout-50-songs-20260808
