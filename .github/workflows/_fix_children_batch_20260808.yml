name: Normalize children batch 20260808

on:
  push:
    branches:
      - codex/children-batch-bingo-call-20260808

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize generated text
        shell: python
        run: |
          from pathlib import Path

          score_path = Path('scorebook.yaml')
          score = score_path.read_text(encoding='utf-8')
          old_title = "      title: '\\"Bingo\\" Traditional Folk Song'"
          new_title = "      title: '\"Bingo\" Traditional Folk Song'"
          assert old_title in score
          score_path.write_text(score.replace(old_title, new_title, 1), encoding='utf-8')

          test_path = Path('tests/scorebook.test.mjs')
          text = test_path.read_text(encoding='utf-8')
          start = text.index("\\ntest('BINGO, This Old Man")
          end = text.index("test('A4 print contract", start)
          fixed = text[start:end].replace('\\n', '\n')
          text = text[:start] + fixed + text[end:]
          test_path.write_text(text, encoding='utf-8')

          Path('.github/workflows/_fix_children_batch_20260808.yml').unlink()
      - name: Commit normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix children batch generated test text"
          git push origin HEAD:codex/children-batch-bingo-call-20260808
