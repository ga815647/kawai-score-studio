name: Apply children batch 20260808

on:
  push:
    branches:
      - codex/children-batch-bingo-call-20260808

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/_apply_children_batch_20260808.py
      - name: Commit canonical batch changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add BINGO, This Old Man, 泥娃娃, 丟手絹, 打電話"
          git push origin HEAD:codex/children-batch-bingo-call-20260808
