name: Repair batch contract

on:
  push:
    branches:
      - feat/children-batch-humpty-donkey-friends
    paths:
      - .github/workflows/repair-batch-contract.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/children-batch-humpty-donkey-friends
          fetch-depth: 0
      - name: Repair contract and clean helpers
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('tests/scorebook.test.mjs'); s=p.read_text(encoding='utf-8'); s=s.replace(\"test('0.6.21 has sixteen verified songs, no quarantine, and passes structural gates'\",\"test('0.6.22 has twenty-one verified songs, no quarantine, and passes structural gates'\",1).replace(\"assert.equal(book.project.version, '0.6.21');\",\"assert.equal(book.project.version, '0.6.22');\",1).replace('verifiedSongs: 16,','verifiedSongs: 21,',1).replace(\"    'tantan-houhou',\\n  ]);\",\"    'tantan-houhou',\\n    'humpty-dumpty',\\n    'little-donkey-zh',\\n    'find-a-friend-zh',\\n    'london-bridge-zh',\\n    'if-you-are-happy-clap-zh',\\n  ]);\",1); p.write_text(s,encoding='utf-8')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-children-batch-tests.yml .github/workflows/repair-batch-contract.yml
          git add tests/scorebook.test.mjs
          git commit -m "test: update library contract for five-song batch"
          git push origin HEAD:feat/children-batch-humpty-donkey-friends
