name: Fix children batch tests

on:
  push:
    branches:
      - feat/children-batch-humpty-donkey-friends
    paths:
      - .github/workflows/fix-children-batch-tests.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/children-batch-humpty-donkey-friends
          fetch-depth: 0
      - name: Update library contract
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('tests/scorebook.test.mjs')
          s = p.read_text(encoding='utf-8')
          s = s.replace("test('0.6.21 has sixteen verified songs, no quarantine, and passes structural gates'", "test('0.6.22 has twenty-one verified songs, no quarantine, and passes structural gates'", 1)
          s = s.replace("assert.equal(book.project.version, '0.6.21');", "assert.equal(book.project.version, '0.6.22');", 1)
          s = s.replace('verifiedSongs: 16,', 'verifiedSongs: 21,', 1)
          marker = "    'tantan-houhou',\n  ]);"
          replacement = "    'tantan-houhou',\n    'humpty-dumpty',\n    'little-donkey-zh',\n    'find-a-friend-zh',\n    'london-bridge-zh',\n    'if-you-are-happy-clap-zh',\n  ]);"
          if marker not in s:
              raise SystemExit('song-list marker missing')
          p.write_text(s.replace(marker, replacement, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-children-batch-tests.yml
          git add tests/scorebook.test.mjs
          git commit -m "test: update library contract for five-song batch"
          git push origin HEAD:feat/children-batch-humpty-donkey-friends
