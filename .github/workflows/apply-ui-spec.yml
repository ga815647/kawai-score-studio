name: Apply UI Spec

on:
  push:
    branches:
      - fix/library-directory-a4-cache
    paths:
      - .github/workflows/apply-ui-spec.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/library-directory-a4-cache
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install YAML tool
        run: python -m pip install PyYAML==6.0.3
      - name: Update scorebook formal UI specification
        run: python scripts/apply_ui_spec.py
      - name: Commit scorebook update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scorebook.yaml
          git diff --cached --quiet && exit 1
          git commit -m "Update formal UI spec for directory and A4 printing"
          git push origin HEAD:fix/library-directory-a4-cache
