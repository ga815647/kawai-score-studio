name: Apply nursery batch

on:
  push:
    branches:
      - content/chinese-nursery-batch-2026-08-07
    paths:
      - scripts/apply-nursery-batch.mjs
      - .github/workflows/apply-nursery-batch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/chinese-nursery-batch-2026-08-07
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: node scripts/apply-nursery-batch.mjs
      - name: Commit generated scorebook changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add five Chinese nursery songs"
          git push origin HEAD:content/chinese-nursery-batch-2026-08-07
