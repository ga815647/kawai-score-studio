name: Apply nursery batch patch

on:
  push:
    branches:
      - codex/children-batch-rain-jack-bear-teapot-ears-20260808

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/children-batch-rain-jack-bear-teapot-ears-20260808
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deterministic YAML writer
        run: python -m pip install pyyaml==6.0.3
      - name: Apply exact local patch
        run: python scripts/_apply_batch_20260808.py
      - name: Commit canonical batch and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/_apply_batch_20260808.py .github/workflows/apply-nursery-batch.yml
          git add scorebook.yaml package.json tests/scorebook.test.mjs tests/difficulty.test.mjs tests/library-visual.spec.mjs
          git commit -m "release: add five verified nursery songs (v0.6.29)"
          git push origin HEAD:codex/children-batch-rain-jack-bear-teapot-ears-20260808
