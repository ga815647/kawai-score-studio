name: Difficulty test migration

on:
  push:
    branches:
      - feat/song-difficulty-sort

permissions:
  contents: write

jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/song-difficulty-sort
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Update browser gate for difficulty UI
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/library-visual.spec.mjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace("規格 0.6.24", "規格 0.6.25")
          text = text.replace("?v=0.6.24-", "?v=0.6.25-")
          anchor = "  await expect(page.locator('#song-directory-list > li')).toHaveCount(31);\n"
          block = anchor + "\n  const difficultyUi = await page.evaluate(() => {\n    const directory = [...document.querySelectorAll('#song-directory-list a')];\n    const cards = [...document.querySelectorAll('.library-song')];\n    const starCount = (text) => (text.match(/★/g) ?? []).length;\n    const directoryDifficulties = directory.map((link) => starCount(link.textContent));\n    const cardDifficulties = cards.map((card) => starCount(card.querySelector('.score-header p:last-child').textContent));\n    return {\n      directoryLabels: directory.map((link) => link.textContent),\n      directoryIds: directory.map((link) => link.dataset.scoreId),\n      cardIds: cards.map((card) => card.dataset.scoreId),\n      directoryDifficulties,\n      cardDifficulties,\n    };\n  });\n  expect(difficultyUi.directoryLabels.every((label) => /[★☆]{5}$/.test(label))).toBe(true);\n  expect(difficultyUi.directoryDifficulties.every((value) => value >= 1 && value <= 5)).toBe(true);\n  expect(difficultyUi.directoryDifficulties).toEqual([...difficultyUi.directoryDifficulties].sort((a, b) => a - b));\n  expect(difficultyUi.cardDifficulties).toEqual(difficultyUi.directoryDifficulties);\n  expect(difficultyUi.cardIds).toEqual(difficultyUi.directoryIds);\n"
          if 'const difficultyUi = await page.evaluate' not in text:
              if anchor not in text:
                  raise SystemExit('difficulty browser gate anchor not found')
              text = text.replace(anchor, block, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit browser gate update
        run: |
          if git diff --quiet; then
            echo 'No browser-gate changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/library-visual.spec.mjs
          git commit -m 'test: gate song difficulty display and sorting'
          git push origin HEAD:feat/song-difficulty-sort
