name: Deploy Pages

on:
  push:
    branches:
      - main
      - refactor/verified-scorebook-core
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Install pinned Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Run required gates including synthetic fixture screenshots
        run: npm run check:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-gate-reports-${{ github.sha }}
          path: |
            reports/
            test-results/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: ${{ github.ref_name == 'main' && 'github-pages' || 'github-pages-preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
