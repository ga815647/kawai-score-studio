name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-source.txt
      - name: Install source verification tools
        run: python -m pip install -r requirements-source.txt
      - run: npm install
      - name: Install pinned Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Run required gates including source evidence and synthetic fixture screenshots
        run: npm run check:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-gate-reports-${{ github.sha }}
          path: |
            reports/
            test-results/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
