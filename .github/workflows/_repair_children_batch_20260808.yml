name: Repair children batch 20260808

on:
  push:
    branches:
      - codex/children-batch-bingo-call-20260808

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair generated text safely
        shell: python
        run: |
          from pathlib import Path

          score_path = Path('scorebook.yaml')
          score_lines = score_path.read_text(encoding='utf-8').splitlines(keepends=True)
          for index, line in enumerate(score_lines):
              if 'title:' in line and 'Bingo' in line:
                  score_lines[index] = line.replace(chr(92), '')
          score_path.write_text(''.join(score_lines), encoding='utf-8')

          test_path = Path('tests/scorebook.test.mjs')
          text = test_path.read_text(encoding='utf-8')
          needle = chr(92) + "ntest('BINGO, This Old Man"
          start = text.index(needle)
          end = text.index("test('A4 print contract", start)
          segment = text[start:end].replace(chr(92) + 'n', '\n')
          test_path.write_text(text[:start] + segment + text[end:], encoding='utf-8')

          Path('.github/workflows/_fix_children_batch_20260808.yml').unlink(missing_ok=True)
          Path('.github/workflows/_repair_children_batch_20260808.yml').unlink(missing_ok=True)
      - name: Commit repaired batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair children batch generated text"
          git push origin HEAD:codex/children-batch-bingo-call-20260808
