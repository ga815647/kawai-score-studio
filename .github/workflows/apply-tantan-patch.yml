name: Apply Tantan Houhou content patch

on:
  push:
    branches:
      - content/tantan-houhou-2026-08-07
    paths:
      - scripts/apply_tantan_patch.py
      - .github/workflows/apply-tantan-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/tantan-houhou-2026-08-07
      - name: Apply score and test updates
        run: python scripts/apply_tantan_patch.py
      - name: Remove temporary helper and commit content
        run: |
          rm .github/workflows/apply-tantan-patch.yml scripts/apply_tantan_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scorebook.yaml package.json README.md tests/scorebook.test.mjs tests/library-visual.spec.mjs
          git add -u .github/workflows/apply-tantan-patch.yml scripts/apply_tantan_patch.py
          git diff --cached --check
          git commit -m "Add 淡々泡々 score"
          git push origin HEAD:content/tantan-houhou-2026-08-07
