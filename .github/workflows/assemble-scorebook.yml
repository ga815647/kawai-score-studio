name: Assemble scorebook payload

on:
  push:
    branches:
      - score/chinese-nursery-five
    paths:
      - '.scorebook-parts/**'
      - '.github/workflows/assemble-scorebook.yml'

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Reconstruct canonical scorebook
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .scorebook-parts/scorebook.flow.yaml.gz.b64 | gunzip > scorebook.yaml
          echo 'fa2828a05bdffb897d409358a530e7e7bb669b26c2ad9f78b1899013ba9db398  scorebook.yaml' | sha256sum --check
      - name: Commit assembled files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .scorebook-parts
          rm .github/workflows/assemble-scorebook.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add five verified Traditional Chinese nursery songs'
          git push origin HEAD:${{ github.ref_name }}
