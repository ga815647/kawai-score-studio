name: Expand Canon

on:
  push:
    branches:
      - score/expand-canon-in-d
    paths:
      - .github/workflows/expand-canon.yml

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: score/expand-canon-in-d
          fetch-depth: 0
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3
      - name: Expand Canon and add sixteenth-note support
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import yaml

          measure_data = [[('3^', 4), ('2^', 4)], [('1^', 4), ('7', 4)], [('6', 4), ('5', 4)], [('6', 4), ('7', 4)], [('1^', 4), ('7', 4)], [('6', 4), ('5', 4)], [('4', 4), ('3', 4)], [('4', 4), ('5', 4)], [('1^', 1), ('6', 1), ('6', 1), ('7', 1), ('1^', 1), ('3^', 0.5), ('2^', 0.5), ('1^', 1), ('3^', 1)], [('4^', 1), ('1^', 0.5), ('7', 0.5), ('6', 1), ('7', 1), ('1^', 3), ('7', 1)], [('5^', 1), ('3^', 0.5), ('4^', 0.5), ('5^', 1), ('3^', 0.5), ('4^', 0.5), ('5^', 0.5), ('5', 0.5), ('6', 0.5), ('7', 0.5), ('1^', 0.5), ('2^', 0.5), ('3^', 0.5), ('4^', 0.5)], [('3^', 1), ('1^', 0.5), ('2^', 0.5), ('3^', 1), ('3', 0.5), ('4', 0.5), ('5', 0.5), ('6', 0.5), ('5', 0.5), ('4', 0.5), ('5', 0.5), ('3', 0.5), ('4', 0.5), ('5', 0.5)], [('4', 1), ('6', 0.5), ('5', 0.5), ('4', 1), ('3', 0.5), ('2', 0.5), ('3', 0.5), ('2', 0.5), ('1', 0.5), ('2', 0.5), ('3', 0.5), ('4', 0.5), ('5', 0.5), ('6', 0.5)], [('4', 1), ('6', 0.5), ('5', 0.5), ('6', 1), ('7', 0.5), ('1^', 0.5), ('5', 0.5), ('6', 0.5), ('7', 0.5), ('1^', 0.5), ('2^', 0.5), ('3^', 0.5), ('4^', 0.5), ('5^', 0.5)], [('5^', 1), ('3^', 0.5), ('4^', 0.5), ('5^', 1), ('3^', 0.5), ('4^', 0.5), ('5^', 0.5), ('5', 0.5), ('6', 0.5), ('7', 0.5), ('1^', 0.5), ('2^', 0.5), ('3^', 0.5), ('4^', 0.5)], [('3^', 1), ('1^', 0.5), ('2^', 0.5), ('3^', 1), ('3', 0.5), ('4', 0.5), ('5', 0.5), ('6', 0.5), ('5', 0.5), ('4', 0.5), ('5', 0.5), ('3', 0.5), ('4', 0.5), ('5', 0.5)], [('4', 1), ('6', 0.5), ('5', 0.5), ('4', 1), ('3', 0.5), ('2', 0.5), ('3', 0.5), ('2', 0.5), ('1', 0.5), ('2', 0.5), ('3', 0.5), ('4', 0.5), ('5', 0.5), ('6', 0.5)], [('4', 1), ('6', 0.5), ('5', 0.5), ('6', 1), ('7', 0.5), ('1^', 0.5), ('5', 0.5), ('6', 0.5), ('7', 0.5), ('1^', 0.5), ('2^', 0.5), ('3^', 0.5), ('4^', 0.5), ('5^', 0.5)], [('3^', 1), ('1^', 0.5), ('2^', 0.5), ('3^', 1), ('2^', 0.5), ('1^', 0.5), ('2^', 0.5), ('7', 0.5), ('1^', 0.5), ('2^', 0.5), ('3^', 0.5), ('2^', 0.5), ('1^', 0.5), ('7', 0.5)], [('1^', 1), ('6', 0.5), ('7', 0.5), ('1^', 1), ('1^', 0.5), ('2^', 0.5), ('3^', 0.5), ('4^', 0.5), ('3^', 0.5), ('2^', 0.5), ('3^', 0.5), ('1^', 0.5), ('7', 0.5), ('1^', 0.5)], [('6', 1), ('1^', 0.5), ('7', 0.5), ('6', 1), ('5', 0.5), ('4', 0.5), ('5', 0.5), ('4', 0.5), ('3', 0.5), ('4', 0.5), ('5', 0.5), ('6', 0.5), ('7', 0.5), ('1^', 0.5)], [('6', 1), ('1^', 0.5), ('7', 0.5), ('1^', 1), ('7', 0.5), ('6', 0.5), ('7', 0.5), ('5', 0.5), ('6', 0.5), ('7', 0.5), ('1^', 0.5), ('2^', 0.5), ('3^', 0.5), ('4^', 0.5)], [('3^', 1), ('1^', 0.5), ('2^', 0.5), ('3^', 1), ('2^', 0.5), ('1^', 0.5), ('2^', 0.5), ('7', 0.5), ('1^', 0.5), ('2^', 0.5), ('3^', 0.5), ('2^', 0.5), ('1^', 0.5), ('7', 0.5)], [('1^', 1), ('6', 0.5), ('7', 0.5), ('1^', 1), ('1^', 0.5), ('2^', 0.5), ('3^', 0.5), ('4^', 0.5), ('3^', 0.5), ('2^', 0.5), ('3^', 0.5), ('1^', 0.5), ('7', 0.5), ('1^', 0.5)], [('3^', 1), ('3', 1), ('4', 1), ('3', 1), ('2', 1), ('2^', 1), ('3^', 1), ('2^', 1)], [('1^', 1), ('3', 1), ('1^', 1), ('6', 1), ('5', 1), ('5', 1), ('4', 1), ('5', 1)], [('6', 1), ('6', 1), ('7', 1), ('6', 1), ('5', 1), ('5', 1), ('4', 1), ('5', 1)], [('6', 1), ('6', 1), ('5', 1), ('6', 1), ('7', 1), ('7', 1), ('6', 1), ('7', 1)], [('1^', 1), ('1^', 1), ('2^', 1), ('1^', 1), ('7', 1), ('7', 1), ('1^', 1), ('7', 1)], [('6', 1), ('6', 1), ('5', 1), ('6', 1), ('7', 1), ('7', 1), ('3^', 1), ('2^', 1)], [('1^', 1), ('1^', 1), ('2^', 1), ('4^', 1), ('3^', 1), ('3', 1), ('5', 1), ('3^', 1)], [('3^', 1), ('4^', 1), ('3^', 1), ('4^', 1), ('2^', 1), ('5', 1), ('2^', 1), ('7', 1)]]

          score_path = Path('scorebook.yaml')
          score = score_path.read_text(encoding='utf-8')
          assert score.count('  version: 0.6.18\n') == 1
          score = score.replace('  version: 0.6.18\n', '  version: 0.6.19\n', 1)
          schema_anchor = '  ties_are_explicit: true\n'
          assert score.count(schema_anchor) == 1
          score = score.replace(schema_anchor, schema_anchor + '  duration_quantum_eighth_units: 0.5\n' + '  smallest_supported_duration: sixteenth_note\n', 1)

          parsed = yaml.safe_load(score)
          canon = next(song for song in parsed['library']['songs'] if song['id'] == 'canon-in-d')
          canon['source']['selected_variant'] = ('lemontart piano arrangement 32-measure xylophone excerpt from source measures 5-12, 35-50, and 61-68; right-hand staff 1 voice 1; source measures 9-12 reduced to the middle chord tone at each onset; all other selected measures use the notated single right-hand note; whole line transposed down 2 semitones from D major to C major with no octave folding')
          canon['source']['selected_source_measures'] = '5-12, 35-50, 61-68'
          canon['source']['chord_reduction'] = ('source measures 9-12 use the middle right-hand chord tone at each onset; all other selected source measures use the notated single right-hand note')
          measures = []
          event_number = 1
          for measure_number, event_data in enumerate(measure_data, start=1):
              events = []
              for pitch, duration in event_data:
                  events.append({'id': f'n{event_number:03d}', 'kind': 'note', 'pitch': pitch, 'duration': duration})
                  event_number += 1
              assert abs(sum(event['duration'] for event in events) - 8) < 1e-9
              measures.append({'number': measure_number, 'capacity_eighth_units': 8, 'events': events})
          assert len(measures) == 32
          assert event_number - 1 == 292
          canon['measures'] = measures
          canon['ties'] = []
          canon['lyric_tracks'] = [{'id': 'instrumental', 'locale': 'zxx', 'role': 'original', 'status': 'verified', 'default': True, 'syllables': []}]

          canon_dump = yaml.safe_dump(canon, sort_keys=False, allow_unicode=True, width=100000).rstrip('\n')
          canon_lines = canon_dump.splitlines()
          canon_block = '  - ' + canon_lines[0] + '\n' + '\n'.join('    ' + line for line in canon_lines[1:]) + '\n'
          pattern = r'  - id: canon-in-d\n.*?(?=  quarantine: \[\]\n)'
          score, replacements = re.subn(pattern, canon_block, score, count=1, flags=re.S)
          assert replacements == 1
          score_path.write_text(score, encoding='utf-8')

          lib_path = Path('scripts/lib.mjs')
          lib = lib_path.read_text(encoding='utf-8')
          old = '''function isPositiveInteger(value) {
            return Number.isInteger(value) && value > 0;
          }

          function isPositiveNumber(value) {'''
          new = '''function isPositiveInteger(value) {
            return Number.isInteger(value) && value > 0;
          }

          function isSupportedDuration(value) {
            return Number.isFinite(value) && value > 0 && Number.isInteger(value * 2);
          }

          function isPositiveNumber(value) {'''
          assert lib.count(old) == 1
          lib = lib.replace(old, new, 1)
          old = '''      if (!isPositiveInteger(event?.duration)) {
                  fail('event-duration', 'event duration 必須是正整數', `${eventPath}.duration`);
                } else {
                  durationSum += event.duration;
                }'''
          new = '''      if (!isSupportedDuration(event?.duration)) {
                  fail('event-duration', 'event duration 必須是 0.5 個八分音符單位的正倍數', `${eventPath}.duration`);
                } else {
                  durationSum += event.duration;
                }'''
          assert lib.count(old) == 1
          lib = lib.replace(old, new, 1)
          anchor = "  if (book?.schema?.version !== 2) fail('schema-version', 'schema.version 必須是 2', 'schema.version');\n"
          assert lib.count(anchor) == 1
          lib = lib.replace(anchor, anchor + "  if (book?.schema?.duration_unit !== 'eighth_note' || book?.schema?.duration_quantum_eighth_units !== 0.5 || book?.schema?.smallest_supported_duration !== 'sixteenth_note') {\n" + "    fail('schema-duration', '時值規格必須以八分音符為單位並支援 0.5 單位的十六分音符', 'schema');\n" + "  }\n", 1)
          lib_path.write_text(lib, encoding='utf-8')

          engine_path = Path('src/score-engine.js')
          engine = engine_path.read_text(encoding='utf-8')
          old = '''const DURATION_PARTS = [
            { units: 6, duration: 'hd', dots: 1 },
            { units: 4, duration: 'h', dots: 0 },
            { units: 3, duration: 'qd', dots: 1 },
            { units: 2, duration: 'q', dots: 0 },
            { units: 1, duration: '8', dots: 0 },
          ];'''
          new = '''const DURATION_PARTS = [
            { units: 6, duration: 'hd', dots: 1 },
            { units: 4, duration: 'h', dots: 0 },
            { units: 3, duration: 'qd', dots: 1 },
            { units: 2, duration: 'q', dots: 0 },
            { units: 1.5, duration: '8d', dots: 1 },
            { units: 1, duration: '8', dots: 0 },
            { units: 0.5, duration: '16', dots: 0 },
          ];'''
          assert engine.count(old) == 1
          engine = engine.replace(old, new, 1)
          old = '''export function decomposeDuration(units) {
            if (!Number.isInteger(units) || units <= 0) throw new Error(`非法時值：${units}`);
            const parts = [];
            let remaining = units;
            for (const part of DURATION_PARTS) {
              while (remaining >= part.units) {
                parts.push({ ...part });
                remaining -= part.units;
              }
            }
            if (remaining !== 0) throw new Error(`無法拆解時值：${units}`);
            return parts;
          }'''
          new = '''export function decomposeDuration(units) {
            if (!Number.isFinite(units) || units <= 0 || !Number.isInteger(units * 2)) {
              throw new Error(`非法時值：${units}`);
            }
            const parts = [];
            let remainingHalfUnits = Math.round(units * 2);
            for (const part of DURATION_PARTS) {
              const partHalfUnits = Math.round(part.units * 2);
              while (remainingHalfUnits >= partHalfUnits) {
                parts.push({ ...part });
                remainingHalfUnits -= partHalfUnits;
              }
            }
            if (remainingHalfUnits !== 0) throw new Error(`無法拆解時值：${units}`);
            return parts;
          }'''
          assert engine.count(old) == 1
          engine = engine.replace(old, new, 1)
          engine_path.write_text(engine, encoding='utf-8')

          package_path = Path('package.json')
          package_text = package_path.read_text(encoding='utf-8')
          assert package_text.count('"version": "0.6.18"') == 1
          package_path.write_text(package_text.replace('"version": "0.6.18"', '"version": "0.6.19"', 1), encoding='utf-8')

          test_path = Path('tests/scorebook.test.mjs')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace("import assert from 'node:assert/strict';\n", "import assert from 'node:assert/strict';\nimport { createHash } from 'node:crypto';\n", 1)
          tests = tests.replace("import { readFile } from 'node:fs/promises';\n", "import { readFile } from 'node:fs/promises';\nimport { decomposeDuration } from '../src/score-engine.js';\n", 1)
          tests = tests.replace('0.6.18', '0.6.19')
          version_assert = "  assert.equal(book.project.version, '0.6.19');\n"
          assert tests.count(version_assert) == 1
          tests = tests.replace(version_assert, version_assert + "  assert.equal(book.schema.duration_quantum_eighth_units, 0.5);\n" + "  assert.equal(book.schema.smallest_supported_duration, 'sixteenth_note');\n", 1)
          canon_test = '''test('Canon in D exactly models the selected 32-measure xylophone excerpt', async () => {
            const { book } = await loadProject();
            const song = book.library.songs.find((candidate) => candidate.id === 'canon-in-d');
            assert.ok(song);
            assert.equal(song.title, 'Canon in D');
            assert.equal(song.alias, '卡農主題');
            assert.equal(song.key, 'C major');
            assert.equal(song.meter, '4/4');
            assert.equal(song.pickup_eighth_units, 0);
            assert.equal(song.measures.length, 32);

            const events = flattenEvents(song);
            assert.equal(events.length, 292);
            assert.equal(events.filter((event) => event.duration === 0.5).length, 172);
            assert.ok(song.measures.every((measure) => measure.events.reduce((sum, event) => sum + event.duration, 0) === 8));
            const compactMeasures = song.measures.map((measure) => measure.events.map((event) => [event.pitch, event.duration]));
            const digest = createHash('sha256').update(JSON.stringify(compactMeasures)).digest('hex');
            assert.equal(digest, 'f0f4fb50337b01533001b537db981283084b75dea6f00910665a90694e639271');
            assert.deepEqual(decomposeDuration(0.5), [{ units: 0.5, duration: '16', dots: 0 }]);
            assert.deepEqual(decomposeDuration(1.5), [{ units: 1.5, duration: '8d', dots: 1 }]);

            assert.deepEqual(song.ties, []);
            const track = song.lyric_tracks.find((candidate) => candidate.default);
            assert.equal(track.id, 'instrumental');
            assert.equal(track.locale, 'zxx');
            assert.equal(track.role, 'original');
            assert.deepEqual(track.syllables, []);
            assert.equal(song.source.original_key, 'D major');
            assert.equal(song.source.selected_source_measures, '5-12, 35-50, 61-68');
            assert.equal(song.source.transposition_semitones, -2);
            assert.match(song.source.selected_variant, /no octave folding/);
            assert.equal(song.source.url, 'https://musescore.org/sites/musescore.org/files/2020-09/Canon_in_D.pdf');
            assert.equal(song.source.supporting_sources[0].file_reference, 'Canon_in_D.mxl');
            assert.equal(song.source.supporting_sources[0].content_sha256, '23762273abf1d6bd7001c89dc620bee6accf0045573078e2865e086df2f1bb14');
            assert.ok(Object.values(song.verification).every((value) => value === true));
          });

          '''
          tests, replacements = re.subn(r"test\('Canon in D exactly models the selected and transposed xylophone theme'.*?(?=test\('A4 print contract)", canon_test, tests, count=1, flags=re.S)
          assert replacements == 1
          test_path.write_text(tests, encoding='utf-8')

          visual_path = Path('tests/library-visual.spec.mjs')
          visual = visual_path.read_text(encoding='utf-8')
          assert visual.count("{ id: 'canon-in-d', title: 'Canon in D', notes: 16, lyrics: 0 }") == 1
          visual = visual.replace("{ id: 'canon-in-d', title: 'Canon in D', notes: 16, lyrics: 0 }", "{ id: 'canon-in-d', title: 'Canon in D', notes: 292, lyrics: 0 }", 1)
          visual = visual.replace('0.6.18', '0.6.19')
          visual_path.write_text(visual, encoding='utf-8')
          PY
      - name: Commit expanded score
        shell: bash
        run: |
          rm .github/workflows/expand-canon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand Canon in D to 32 measures"
          git push origin HEAD:score/expand-canon-in-d
