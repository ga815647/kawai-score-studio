name: Apply Pages visual timeout fix

on:
  push:
    branches:
      - codex/pages-visual-timeout-50-songs-20260808

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pages-visual-timeout-50-songs-20260808
      - name: Increase full-library visual gate headroom without changing assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/library-visual.spec.mjs')
          text = path.read_text(encoding='utf-8')
          old = '  test.setTimeout(120_000);\n'
          new = '  // Full-library geometry validation scales with the verified-song count.\n  test.setTimeout(240_000);\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one 120s library timeout, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-pages-timeout-fix.yml
          git add tests/library-visual.spec.mjs
          git commit -m "ci: scale library visual gate for 50 songs"
          git push origin HEAD:codex/pages-visual-timeout-50-songs-20260808
